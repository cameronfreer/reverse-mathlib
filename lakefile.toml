name = "reverse-mathlib"
version = "0.1.0"
license = "Apache-2.0"
keywords = ["math"]
defaultTargets = ["ReverseMathlib", "ReverseMathlibExperimental", "ReverseMathlibFixtures"]

# Pinned to the mathlib revision at the v4.32.0 tag, matching the other projects
# in this workspace so everything builds against exactly one mathlib.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "81a5d257c8e410db227a6665ed08f64fea08e997"

[[lean_lib]]
name = "ReverseMathlib"
# Two build roots: `ReverseMathlib` (mathematical production modules only) and
# `ReverseMathlib.Registry` (tooling/registry/ports). The mathematical root never imports the
# tooling root; `scripts/check_sorry_boundary.py` enforces the separation and that every file
# under `ReverseMathlib/` is reachable from one of the two roots.
globs = ["ReverseMathlib", "ReverseMathlib.Registry"]
# `longFile` and `longFileDefValue` must be set to the same value, or the linter
# nags to remove a `set_option` on every short file (fatal under `warningAsError`).
leanOptions = { autoImplicit = false, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, weak.linter.style.longFileDefValue = 1500, warningAsError = true }

# Work in progress and material staged for upstreaming. Never imported by the
# `ReverseMathlib` root spine — `scripts/check_sorry_boundary.py` enforces that — so
# `sorry` is permitted here and only here. It is still a default target, so CI requires
# it to typecheck; `warningAsError` is off because `declaration uses 'sorry'` is a
# warning and would otherwise fail the build.
# Compile-time collision-test fixtures for the conceptual catalog (sibling modules that must
# conflict only when merged). Never imported by the production roots — the boundary checker
# enforces that.
[[lean_lib]]
name = "ReverseMathlibFixtures"
leanOptions = { autoImplicit = false, warningAsError = true }

[[lean_lib]]
name = "ReverseMathlibExperimental"
leanOptions = { autoImplicit = false, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, weak.linter.style.longFileDefValue = 1500, warningAsError = false }
