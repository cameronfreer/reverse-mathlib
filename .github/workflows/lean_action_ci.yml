name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Builds both default targets: the `ReverseMathlib` root spine (strict —
      # `warningAsError` is on) and the `ReverseMathlibExperimental` staging library
      # (sorries permitted, but it must still typecheck).
      - uses: leanprover/lean-action@v1

      # The sorry boundary and root separation: both production roots (`ReverseMathlib`
      # mathematical, `ReverseMathlib.Registry` tooling) are sorry-free, the mathematical
      # root never imports tooling modules, no file under `ReverseMathlib/` is orphaned,
      # and neither root imports the staging library. Pure source analysis, so it does not
      # depend on build artefacts.
      - name: Verify the sorry boundary
        run: python3 scripts/check_sorry_boundary.py

      # Axiom hygiene: an environment sweep over every declaration owned by a
      # `ReverseMathlib` module — including private and compiler-generated ones — plus a
      # headline regression list. `ReverseMathlibExperimental` is deliberately out of
      # scope; work is audited when it is promoted into the spine.
      - name: Verify axiom hygiene
        run: lake env lean scripts/AxiomAudit.lean

      # The same standard-axiom policy for the tooling root (`ReverseMathlib.Meta.*`,
      # `ReverseMathlib.Ports.*`, `ReverseMathlib.Registry`). No exemption mechanism.
      - name: Verify tooling axiom hygiene
        run: lake env lean scripts/MetaAxiomAudit.lean

      # Dependency-miner micro-tests and the hard dependency assertions (semantic CI
      # gates: assertions require complete closures and fail on truncated graphs).
      - name: Meta smoke tests and dependency assertions
        run: lake env lean scripts/MetaSmoke.lean

      # The zoo: deterministic catalog export from the elaborated environment, canonical
      # invariant checks (direction-aware edge recomputation, sortedness, no timestamps),
      # and the ambient-factorization view. SVG is ephemeral (Graphviz bytes vary across
      # versions); JSON and DOT are the comparands.
      - name: Build and check the zoo
        run: |
          which dot >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq graphviz)
          python3 tools/zoo/rmlib_zoo.py build
          python3 tools/zoo/rmlib_zoo.py check

      - name: Upload zoo site artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoo-site
          path: .lake/build/zoo/site
