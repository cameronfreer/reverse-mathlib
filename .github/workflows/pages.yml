name: Deploy zoo to GitHub Pages

# Separate from ordinary CI on purpose: `pages: write` and `id-token: write` stay out of the
# read-only PR workflow. Follows GitHub's supported design — a build job producing a Pages
# artifact, then a protected deploy job.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: leanprover/lean-action@v1

      - name: Build the zoo site
        run: |
          which dot >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq graphviz)
          python3 tools/zoo/rmlib_zoo.py build
          python3 tools/zoo/rmlib_zoo.py check --require-pin

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .lake/build/zoo/site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
