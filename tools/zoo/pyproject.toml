[project]
name = "rmlib-zoo"
version = "0.1.0"
description = "Orchestration and rendering for the reverse-mathlib catalog (leanblueprint-style CLI)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rmlib-zoo = "rmlib_zoo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["rmlib_zoo.py"]
